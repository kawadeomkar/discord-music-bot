---
services:
  discord-music-bot:
    container_name: discord-music-bot
    build:
      context: .
      dockerfile: Dockerfile
    image: discord-music-bot:${GIT_SHA:-latest}
    restart: always
    network_mode: host
    env_file:
    - .env
    environment:
      - ENVIRONMENT
      - OTEL_SERVICE_NAME=discord-music-bot
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317
      # Set OTEL_SDK_DISABLED=true in .env to disable tracing in local dev
    volumes:
      # yt-dlp's disk cache: player JS + EJS-solved sig/n challenges. Without it a
      # container restart re-pays the player fetch + challenge solve on the first song.
      - ytdlp-cache:/root/.cache/yt-dlp
    depends_on:
      redis:
        condition: service_healthy
      # otel-lgtm is intentionally NOT in depends_on.
      # The OTLP BatchSpanProcessor retries silently if otel-lgtm is slow to start,
      # so a hard dependency would break `docker compose up discord-music-bot redis`.
      # bgutil-pot-provider is intentionally NOT in depends_on either: the bot is
      # fully functional without it (web_safari degrades to token-less, android_vr
      # is untouched — see docs/PO_TOKEN_SIDECAR_PLAN.md §3.3).

  redis:
    image: redis:7-alpine
    container_name: discord-redis
    restart: always
    # volatile-lru, NOT allkeys-lru: guild:{id}:history keys are persistent
    # (no TTL — unbounded full-history retention, docs/HISTORY_OVERHAUL_PLAN.md
    # §4) and must never be eviction candidates. Every cache key (ytdl:*,
    # spotify:*) and the other guild:* keys carry TTLs, so volatile-lru
    # preserves the existing cache-eviction behavior for them.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    # Durable home of play history (docs/POSTGRES_HISTORY_PLAN.md). The server
    # and its schema land ahead of the code that will use them — nothing in the
    # bot reads or writes Postgres yet, so this service is inert for now.
    image: postgres:18-alpine
    container_name: discord-postgres
    restart: always
    environment:
      # Interpolated from the project .env at compose parse time (NOT env_file —
      # that would spray the bot's other secrets into this container). The
      # db-migrate one-shot below builds its URL from these same three values.
      - POSTGRES_USER=${POSTGRES_USER:-musicbot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=${POSTGRES_DB:-musicbot}
    ports:
      # Loopback-bound, and the host side is overridable: the `just db-*`
      # recipes run on the host and reach the database through this published
      # port, and 5432 is the port a developer's own local Postgres already
      # holds. Set POSTGRES_HOST_PORT in .env to move it — those recipes build
      # their host DSN from the same variable, so the two cannot drift.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # 18+ image layout: the declared volume moved to /var/lib/postgresql
      # (PGDATA is version-specific beneath it). Mounting the old .../data
      # path would silently store the cluster OUTSIDE the volume.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # $$ escapes compose interpolation so the container's own env expands at
      # runtime — keeps the check correct if the user/db are customized in .env.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  db-migrate:
    # One-shot schema migration. Nothing depends on it yet — the bot does not
    # touch Postgres — but `docker compose up` runs it, so a fresh volume comes
    # up already migrated rather than waiting for someone to remember.
    #
    # The bot image, not a postgres client image: the runner is src/db_migrate.py
    # and the migrations ship in that image, so there is exactly one definition
    # of "what schema this build expects" and no way for a sidecar image to
    # drift from it.
    #
    # `restart: "no"` is explicit and load-bearing — the default here would
    # inherit nothing, but a copy-paste of `restart: always` from the services
    # above would turn a successful one-shot into a crash loop of successful
    # exits.
    image: discord-music-bot:${GIT_SHA:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-postgres-migrate
    restart: "no"
    command: ["python", "-m", "src.db_migrate"]
    environment:
      # Container networking here (not 127.0.0.1): this service is on the
      # compose network, so it addresses postgres by service name and is
      # unaffected by POSTGRES_HOST_PORT.
      - POSTGRES_URL=postgresql://${POSTGRES_USER:-musicbot}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-musicbot}
    depends_on:
      postgres:
        condition: service_healthy

  bgutil-pot-provider:
    # Mints GVS Proof-of-Origin tokens so web_safari can serve audio as a fallback
    # client (docs/PO_TOKEN_SIDECAR_PLAN.md). Version must match the
    # bgutil-ytdlp-pot-provider pin in pyproject.toml — plugin and server are
    # released in lockstep; bump both together.
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    container_name: discord-pot-provider
    restart: unless-stopped
    init: true
    ports:
      # The bot runs with network_mode: host and reaches this via 127.0.0.1:4416 —
      # the bgutil plugin's built-in default base_url.
      - "127.0.0.1:4416:4416"
    healthcheck:
      # The image ships no wget/curl — node (>=20, global fetch) is the only HTTP
      # client available.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: discord-otel-lgtm
    restart: unless-stopped
    ports:
      - "127.0.0.1:3014:3000"    # Grafana UI (localhost only)
      - "127.0.0.1:4317:4317"    # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"    # OTLP HTTP receiver
    volumes:
      - otel-grafana:/var/lib/grafana
      - otel-tempo:/tmp/tempo
      - otel-loki:/tmp/loki
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  postgres-data:
  ytdlp-cache:
  otel-grafana:
  otel-tempo:
  otel-loki:
