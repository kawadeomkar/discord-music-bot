# Git hooks. Install them with `just hooks`.
#
# These are a CONVENIENCE, never the gate. Hooks are per-clone, absent on a fresh
# checkout, and one `--no-verify` from being skipped — so nothing whose absence
# would be a defect may depend on them. CI plus branch protection remains the
# enforcement boundary, and .github/workflows/ci.yml still runs these same ruff
# commands explicitly.
#
# The split across stages is a time budget, and it is the whole design:
#
#   pre-commit  ruff (~0.13s) + trivia    fast enough to never think about
#   pre-push    just check (~28s)         the "will CI pass" gate, once per push
#
# pyright (~8s) and pytest (~26s) are deliberately NOT on pre-commit. A hook slow
# enough to interrupt your train of thought is a hook that teaches you to reach
# for --no-verify, and that habit costs more than the checks ever caught.
#
# Note: the formatting hooks REWRITE files. A commit that trips one fails and
# leaves the fixes unstaged — `git add` them and commit again. That is working as
# intended, not a bug.

default_install_hook_types: [pre-commit, pre-push]

# Required, not cosmetic. pre-commit's default for a hook that omits `stages` is
# EVERY stage, not "pre-commit" — so without this line the ruff hooks also ran on
# pre-push, against the whole origin..HEAD file list, rewriting files and leaving
# a failed push with unstaged edits to already-finished commits.
#
# This covers only hooks that declare no stages of their own. Three of the
# pre-commit-hooks below ship upstream stages that outrank it and opt out
# individually; just-check opts back IN to pre-push.
default_stages: [pre-commit]

# coverage.json is a generated artifact that happens to be tracked (last written
# 2026-06-17, long stale). Reformatting a build output produces pure churn, and a
# hook that rewrites files nobody edits is a hook people learn to distrust.
# It arguably should not be in git at all — but that is a separate decision, and
# excluding it here does not depend on making it.
exclude: '^coverage\.json$'

repos:
  # rev must match the ruff version in pyproject.toml's lint group: the hook runs
  # ruff from its own isolated env, so a drift here means the hook formats one way
  # and `just lint` / CI checks another. `just hooks-update` bumps this; bump the
  # poetry constraint in the same commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      # Lint before format: --fix can emit changes that need reformatting.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      # These three ship `stages: [pre-commit, pre-push, manual]` in the upstream
      # .pre-commit-hooks.yaml, and a hook's OWN stages beat this file's
      # default_stages — so the top-level default does not reach them and they
      # have to opt out one by one. It matters most for the two fixers: on a push
      # they would rewrite every file in origin..HEAD, abort the push, and leave
      # unstaged edits behind on already-finished commits.
      - id: check-added-large-files
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: check-toml
      - id: check-yaml
        # deploy/k8s/ manifests (docs/K8S_DEPLOYMENT_PLAN.md) are multi-document
        # YAML, and Kustomize output routinely is. Set now so the hook does not
        # start failing the day those land.
        args: [--allow-multiple-documents]

  - repo: local
    hooks:
      # These five ARE `just check`'s dependency list, one hook each, in its order.
      #
      # Why five hooks and not one: pre-commit renders one dotted status line per HOOK
      # and runs hooks strictly sequentially, so the number of live status lines is the
      # number of hooks — nothing inside a hook can produce one. It also CAPTURES a
      # hook's output and replays it only after that hook exits (commands/run.py, the
      # `out.strip()` at the end of _run_single_hook), so a hook that printed at t=0,
      # t=3 and t=6 was measured emitting all three lines at t+6. No amount of
      # concurrency inside a single hook — GNU parallel, `[parallel]`, `xargs -P` —
      # changes either fact.
      #
      # Why not SIX hooks: `types` and `test` are fused into `check-heavy` because
      # pyright's ~8s hides entirely inside pytest's ~26s. Separating them would buy a
      # sixth line for ~8s of wall clock. The four below cost ~1.3s combined, so their
      # lines are nearly free — that asymmetry is the whole design, and it is measured
      # rather than assumed. See the HEAVY comment in the justfile.
      #
      # Keep this list in step with `check`'s dependencies; `just --dump --dump-format
      # json` prints them if you need to diff the two.
      #
      # `language: system` runs these against git's ambient PATH, so `just` must be
      # installed system-wide -- see the README's Requirements. Do NOT "fix" that
      # with `language: python` + `additional_dependencies: [rust-just]`:
      # pre-commit sets VIRTUAL_ENV to the isolated hook env, the justfile's
      # VENV_BIN follows $VIRTUAL_ENV, and every tool would then be looked up
      # inside a venv containing only `just`. Measured, not theorised.
      #
      # Unlike `make`, these CAN fail for want of the runner. A push from a GUI
      # client with a minimal PATH may not find `just`; --no-verify is the escape
      # hatch, as it always was.
      #
      # Every one of them needs pass_filenames: false and always_run: true. The first
      # because pyright is a whole-program analysis and the test suite is not
      # partitioned by path, so passing filenames would be meaningless; the second
      # because pre-commit SKIPS a hook whose filename list came out empty, and a push
      # containing only deletions produces exactly that — the gate would report
      # "Skipped" on precisely the change most likely to break the build.
      #
      # No fail_fast on any of them, deliberately: a red push should report every
      # failure at once rather than one per fix-push cycle.
      - id: just-fmt-justfile
        name: justfile format
        entry: just fmt-justfile
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: just-pins
        name: version pins
        entry: just pins
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: just-fmt-check
        name: ruff format
        entry: just fmt-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: just-lint
        name: ruff lint
        entry: just lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: just-check-heavy
        name: pyright + pytest (concurrent)
        entry: just check-heavy
        language: system
        pass_filenames: false
        always_run: true
        # The one hook covering two tools, so it is the one that has to say which of
        # them failed — and on a green run, that pyright was not silently skipped.
        # `verbose` makes pre-commit print a PASSING hook's output too, which is where
        # check-heavy's per-task ✓/✗ recap lands.
        verbose: true
        stages: [pre-push]

      # Keeps the task file canonically formatted, which `make` had no equivalent
      # for. Runs on commit rather than push: it is ~0.01s and only fires when the
      # justfile itself is staged. Same PATH requirement as just-check above.
      - id: just-fmt
        name: just --fmt --check
        entry: just --fmt --check --justfile
        language: system
        files: ^justfile$
